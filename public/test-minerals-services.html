<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minerals Services Test</title>
    <style>
      .minerals_content {
        width: 680px;
        height: 680px;
        position: relative;
      }
      .minerals-slider {
        display: none;
        width: 95%;
        aspect-ratio: 1;
        border-radius: 100%;
        align-items: center;
        justify-content: center;
      }
      .minerals-slider_sequence {
        width: 100%;
        height: 70%;
      }
      .minerals_canvas {
        width: 100%;
        height: 100%;
        display: block;
      }
      .minerals-slider_inner {
        display: flex;
      }
    </style>
  </head>
  <body>
    <div data-barba="wrapper">
      <div data-barba="container" data-barba-namespace="services" class="page-wrap">
        <div class="section_minerals">
          <div fc-image-scrubbing="component" fc-image-scrubbing-urls="" class="minerals-stage">
            <div class="minerals-inner">
              <div class="minerals_content">
                <div class="minerals-slider">
                  <div class="minerals-slider_sequence">
                    <canvas class="minerals_canvas"></canvas>
                  </div>
                  <div class="minerals-slider_inner">
                    <img class="minerals-slider_img" alt="" />
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script type="module">
      import { findMineralsCanvasComponent, initMineralsCanvas } from '/src/animation/minerals-canvas-local-debug.js'

      window.__test = { findMineralsCanvasComponent, initMineralsCanvas }
      const component = findMineralsCanvasComponent(document)
      window.__test.componentClass = component?.className || null
      initMineralsCanvas(document)
      window.__test.initCalled = true
    </script>
  </body>
</html>
